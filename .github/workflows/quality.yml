name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
        env:
          POSTGRES_DB: atr_ci
          POSTGRES_USER: atr_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atr_ci -d atr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://atr_ci:ci-only-not-a-secret@127.0.0.1:5432/atr_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends antiword unar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Validate source and migrations
        run: |
          python tools/check_public_boundary.py
          python -m compileall -q app agent_radar scripts
          python scripts/apply_migrations.py --dry-run

      - name: Verify clean PostgreSQL bootstrap
        run: |
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py --check
          python scripts/verify_database_bootstrap.py --exercise-append-only

      - name: Run unit tests
        run: python -m unittest discover
