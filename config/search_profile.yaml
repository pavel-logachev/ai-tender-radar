      - система хранения данных
      - системы хранения данных
      - поставка системы хранения данных

  storage_expansion_focused:
    description: Focused weekly probe for СХД expansion and disk capacity.
    queries:
      - расширение системы хранения данных
      - расширение СХД
      - расширение дискового пространства
      - комплект расширения дискового пространства
      - полка расширения для СХД
      - дисковый массив

  storage_data_center_focused:
    description: Focused weekly probe for data-center storage formulations.
    queries:
