name: servers_storage_daily_search

defaults:
  days_back: 14
  min_price: 500000
  limit_full_per_query: 10
  max_short_results_per_query: 50

# Совместимость с app.pipeline.daily_run: старый daily runner читает top-level queries.
days_back: 14
min_price: 500000
limit_full_per_query: 10
queries:
  - СХД
  - система хранения данных
  - системы хранения данных
  - поставка системы хранения данных
  - сервер
  - серверное оборудование
  - поставка серверов
  - поставка серверного оборудования
  - вычислительный комплекс

groups:
  core:
    description: Stable daily core kept for compatibility.
    packs:
      - storage_basic
      - servers_basic
  daily_core:
    description: Stable daily core after the storage_wide probe.
    packs:
      - storage_basic
      - servers_basic
  storage_weekly_probe:
    description: Small weekly storage probe with focused packs only.
    packs:
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
  servers_weekly_probe:
    description: Small weekly server probe with focused packs only.
    packs:
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  servers_storage_weekly_probe:
    description: Small weekly combined storage and server probe.
    packs:
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  servers_storage_vendor_manual:
    description: Manual vendor/model probe; not a daily group.
    packs:
      - storage_vendor_probe
      - servers_vendor_probe
  storage:
    description: Compatibility alias; focused weekly storage probe plus basic storage.
    packs:
      - storage_basic
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
  servers:
    description: Compatibility alias; focused weekly server probe plus basic servers.
    packs:
      - servers_basic
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  extended:
    description: Compatibility alias for a focused weekly probe; not daily.
    packs:
      - storage_basic
      - servers_basic
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  servers_wide:
    description: Heavy diagnostic/manual-only compatibility group; shortened to focused server packs after probe.
    packs:
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  storage_wide:
    description: Heavy diagnostic/manual-only compatibility group; shortened to focused storage packs after probe.
    packs:
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
  servers_vendor:
    description: Compatibility manual vendor probe; prefer servers_storage_vendor_manual for combined vendor runs.
    packs:
      - servers_vendor_probe
  storage_vendor:
    description: Compatibility manual vendor probe; prefer servers_storage_vendor_manual for combined vendor runs.
    packs:
      - storage_vendor_probe
  servers_storage_wide:
    description: Heavy diagnostic/manual-only compatibility group; shortened to focused storage and server packs after probe.
    packs:
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
  servers_storage_vendor_probe:
    description: Compatibility alias for manual vendor probe; prefer servers_storage_vendor_manual.
    packs:
      - storage_vendor_probe
      - servers_vendor_probe
  servers_storage_experiments:
    description: Heavy diagnostic/manual-only experiments; not recommended as a working group.
    packs:
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
      - storage_exact_component_probe
      - storage_vendor_probe
      - servers_vendor_probe
  all:
    description: Compatibility diagnostic group; use daily_core, weekly probes, or vendor_manual instead.
    packs:
      - storage_basic
      - servers_basic
      - storage_expansion_focused
      - storage_data_center_focused
      - storage_domestic_focused
      - servers_compute_focused
      - servers_modernization_focused
      - servers_workload_focused
      - storage_vendor_probe
      - storage_exact_component_probe
      - servers_vendor_probe
      - optional_network

packs:
  storage_basic:
    description: Базовые запросы по СХД и системам хранения данных
    queries:
