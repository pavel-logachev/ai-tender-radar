documents:
  limit_tenders: 50
  limit_docs: 6

text_extraction:
  limit: 200

document_risk:
  limit_tenders: 50

digest:
  limit: 15
  output_path: data/digests/latest.md

llm:
  enabled: false
  limit: 5
  max_spec_chars: 90000
  max_other_chars: 12000
  max_output_tokens: 4096

api_limits:
  z360:
    search_requests_per_day: 100
    full_order_requests_per_day: 500
    document_requests_per_day: 5000

collector_budget:
  skip_existing_tenders: true
  stop_on_429: true
  recommended_rate_limit_seconds: 5
  recommended_limit_full_per_query: 10
  recommended_max_short_results_per_query: 50
